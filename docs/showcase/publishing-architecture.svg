<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900"><rect width="1600" height="900" fill="#faf8f2"/><g font-family="Microsoft YaHei,SimHei,sans-serif" fill="#382f29"><text x="60" y="80" font-size="22" fill="#526f7b">之青个人网站 / LOCAL CMS → STATIC WEB</text><text x="60" y="160" font-size="52" font-weight="700">在本机管理，让网站持续在线。</text><text x="60" y="215" font-size="25" fill="#73685d">管理与访问分开：编辑时启动后台，发布后由云端提供页面。</text><rect x="60" y="300" width="440" height="300" fill="#e9eef0" stroke="#9b9383" stroke-width="2"/><text x="88" y="350" font-size="24" fill="#526f7b">01</text><text x="88" y="415" font-size="35" font-weight="700">本机内容管理</text><text x="88" y="485" font-size="25">编辑作品 · 上传图片</text><text x="88" y="535" font-size="25">草稿保存 · 本机预览</text><rect x="550" y="300" width="440" height="300" fill="#eee4cc" stroke="#9b9383" stroke-width="2"/><text x="578" y="350" font-size="24" fill="#526f7b">02</text><text x="578" y="415" font-size="35" font-weight="700">整站发布器</text><text x="578" y="485" font-size="25">确认上线 · 静态构建</text><text x="578" y="535" font-size="25">候选部署 · 版本核验</text><rect x="1040" y="300" width="440" height="300" fill="#e4ebe2" stroke="#9b9383" stroke-width="2"/><text x="1068" y="350" font-size="24" fill="#526f7b">03</text><text x="1068" y="415" font-size="35" font-weight="700">云端静态网站</text><text x="1068" y="485" font-size="25">EdgeOne 托管与分发</text><text x="1068" y="535" font-size="25">独立域名 · 持续访问</text><text x="510" y="465" font-size="36">→</text><text x="1000" y="465" font-size="36">→</text><path d="M60 670H1480" stroke="#c9c0b2"/><text x="60" y="730" font-size="28" font-weight="700">电脑关机后，已部署的网站仍可访问。</text><text x="60" y="785" font-size="23" fill="#73685d">无需常驻云端 CMS 与数据库；前端使用平台免费套餐，独立域名费用另计。</text><text x="60" y="836" font-size="21" fill="#73685d">境外节点提供服务；各地区网络体验以实际访问为准。</text></g></svg>